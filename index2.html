<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>

    <h1>Contact Me</h1>

    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Photos:</label>
        <input type="file">
        <br><br>
        <input type ="file"><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>tick:</label>
        <input type="radio">
        <br><br>

        <label>range between:</label>
        <input type="range">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Skills:</label>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <br><br>

        <label>Country:</label>
        <select>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>UK</option>
        </select>
        <br><br>

        <label>Message:</label>
        <br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
